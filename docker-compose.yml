# Local parity / self-hosting compose file for the Kifaah backend
# (CONTRACT.md §7.5) — Postgres + the backend API, .env driven. Not tied to
# any specific cloud provider.
#
# Usage:
#   cp backend/.env.example backend/.env   # then edit backend/.env
#   docker compose up --build
#
# The backend's DATABASE_URL in backend/.env should point at the `postgres`
# service by its compose network hostname when run this way, e.g.:
#   DATABASE_URL="postgresql://postgres:postgres@postgres:5432/kifaah?schema=public"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kifaah}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kifaah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in backend/.env so this service
      # always talks to the `postgres` service above, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-kifaah}?schema=public
      PORT: 4000
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kifaah_uploads:/app/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.kifaah-api.rule=Host(`kifaah-api.srv1164487.hstgr.cloud`)
      - traefik.http.routers.kifaah-api.tls=true
      - traefik.http.routers.kifaah-api.entrypoints=web,websecure
      - traefik.http.routers.kifaah-api.tls.certresolver=mytlschallenge
      - traefik.http.services.kifaah-api.loadbalancer.server.port=4000
      - traefik.docker.network=n8n_default
    networks:
      - default
      - n8n_default

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./mobile/dist:/usr/share/nginx/html:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      # Router for Hostinger subdomain (cert issued immediately)
      - traefik.http.routers.kifaah-hostinger.rule=Host(`kifaah-web.srv1164487.hstgr.cloud`)
      - traefik.http.routers.kifaah-hostinger.tls=true
      - traefik.http.routers.kifaah-hostinger.entrypoints=web,websecure
      - traefik.http.routers.kifaah-hostinger.tls.certresolver=mytlschallenge
      - traefik.http.routers.kifaah-hostinger.service=kifaah-web
      # Router for custom domain (cert issued after DNS A record is added)
      - traefik.http.routers.kifaah-web.rule=Host(`kifaah.alzakwaantours.com`)
      - traefik.http.routers.kifaah-web.tls=true
      - traefik.http.routers.kifaah-web.entrypoints=web,websecure
      - traefik.http.routers.kifaah-web.tls.certresolver=mytlschallenge
      - traefik.http.services.kifaah-web.loadbalancer.server.port=80
      - traefik.docker.network=n8n_default
    networks:
      - default
      - n8n_default

volumes:
  kifaah_postgres_data:
  kifaah_uploads:

networks:
  default: {}
  n8n_default:
    external: true
