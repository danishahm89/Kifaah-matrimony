workflows:
  android-release-apk:
    name: Kifaah Android Release APK
    max_build_duration: 60
    environment:
      node: 22
      groups:
        - android_signing
      vars:
        EXPO_PUBLIC_API_URL: "https://kifaah-api.srv1164487.hstgr.cloud"
    working_directory: mobile
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (android)
        script: npx expo prebuild --platform android --no-install
      - name: Fix splash screen resource
        script: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/splash-icon.png android/app/src/main/res/drawable/splashscreen_logo.png
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo '--- APK search ---'
          find /Users/builder/clone -iname '*.apk' 2>/dev/null
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/debug/*.apk
      - "**/outputs/apk/debug/*.apk"
    publishing:
      email:
        recipients:
          - danishahm89@gmail.com
        notify:
          success: true
          failure: true
