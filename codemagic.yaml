workflows:
  android-debug-apk:
    name: Kifaah Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      vars:
        EXPO_PUBLIC_API_URL: "https://kifaah-api.srv1164487.hstgr.cloud"
    working_directory: mobile
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (android)
        script: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - danishahm89@gmail.com
        notify:
          success: true
          failure: true
